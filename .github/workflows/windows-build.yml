name: windows-build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  BH_VERSION: v9.9.2

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.4'
          cache: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full zip unzip

      - name: Checkout BloodHound with Windows patches
        run: |
          git clone --filter=blob:none https://github.com/SpecterOps/BloodHound.git src
          git -C src checkout 54b4e764e645468d8393f99214ab9611bb171f83
          git -C src apply "$GITHUB_WORKSPACE/patches/windows-portability.patch" "$GITHUB_WORKSPACE/patches/collector-manifest.patch"

      - name: Fetch PostgreSQL payload
        run: scripts/fetch-postgres.sh windows

      - name: Build self-contained exe
        run: scripts/build.sh windows

      - name: Package
        run: |
          cp dist/BloodHoundCE.exe dist/BloodHoundCE-windows-amd64.exe
          (cd dist && sha256sum BloodHoundCE-windows-amd64.exe > SHA256SUMS-windows.txt)

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: BloodHoundCE-windows-amd64
          path: |
            dist/BloodHoundCE-windows-amd64.exe
            dist/SHA256SUMS-windows.txt

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/BloodHoundCE-windows-amd64.exe
            dist/SHA256SUMS-windows.txt
          overwrite_files: true
